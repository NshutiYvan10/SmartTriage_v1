# SmartTriage gateway configuration — EXAMPLE (placeholders only).
# Generate the real file with provision.py; it will contain live API
# keys, so it lives OUTSIDE the repo (/etc/smarttriage/devices.yaml,
# chmod 600) and is loaded via GATEWAY_CONFIG.
backend_url: http://192.168.1.50:8080
listen_port: 8090
tx_interval_seconds: 5
devices:
  - role: bedside            # continuous ED monitoring → /ingest
    name: SIM-BED-01
    serial: SIM-BEDSIDE-01
    api_key: PASTE_KEY_HERE
  - role: bedside
    name: SIM-BED-02
    serial: SIM-BEDSIDE-02
    api_key: PASTE_KEY_HERE
  - role: triage             # SATS-banded presets (GREEN/YELLOW/ORANGE/RED)
    name: SIM-TRIAGE-01
    serial: SIM-TRIAGE-03
    api_key: PASTE_KEY_HERE
  - role: paramedic          # snapshot telemetry → EMS "pull from my monitor"
    name: SIM-EMS-01
    serial: SIM-PARAMEDIC-04
    api_key: PASTE_KEY_HERE
