<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartTriage — System Bible</title>
<style>
/* ============================================================
   SmartTriage System Bible — print design system
   Palette: ink #132A3A · teal #0E7490 (deep #155E75) · paper #FFF
   tint #F2F7F9 · muted #5B6B76 · danger #B4232A · warn #9A5B00
   success #1A7A45 · Triage bands: red/orange/yellow/green
   Type: Avenir Next (display+body) · Menlo (data)
   ============================================================ */
@page { size: A4; margin: 16mm 15mm 18mm 15mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  font-size: 9.6pt; line-height: 1.58; color: #132A3A;
  font-feature-settings: "kern";
}

/* ---------- typography ---------- */
h1, h2, h3, h4 { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: #132A3A; }
p { margin: 0 0 7pt 0; max-width: 172mm; }
strong { font-weight: 600; }
em { font-style: italic; }
code, .mono {
  font-family: "Menlo", "SF Mono", monospace; font-size: 8.2pt;
  background: #EEF3F5; border-radius: 3px; padding: 0.5pt 3pt; color: #14424E;
}
sup.xref { color: #0E7490; font-weight: 600; font-size: 7pt; }
a { color: #0E7490; text-decoration: none; }
ul, ol { margin: 0 0 8pt 0; padding-left: 16pt; max-width: 168mm; }
li { margin-bottom: 2.5pt; }
li > ul, li > ol { margin-top: 2.5pt; margin-bottom: 0; }

.kicker {
  font-size: 7.4pt; font-weight: 700; letter-spacing: 1.8pt; text-transform: uppercase;
  color: #0E7490; margin-bottom: 4pt;
}
.muted { color: #5B6B76; }
.small { font-size: 8.2pt; }

/* ---------- chapters ---------- */
.chapter { break-before: page; }
.ch-open {
  background: linear-gradient(135deg, #F2F7F9 0%, #E7F1F4 100%);
  border-radius: 10px; padding: 20pt 22pt 18pt 22pt; margin-bottom: 16pt;
  border-left: 5px solid #0E7490;
}
.ch-num {
  font-size: 34pt; font-weight: 300; color: #0E7490; line-height: 1;
  letter-spacing: -1pt; margin-bottom: 2pt;
}
.ch-open h1 { font-size: 20pt; font-weight: 700; letter-spacing: -0.3pt; margin: 2pt 0 6pt 0; }
.ch-lede { font-size: 10.3pt; color: #35505F; max-width: 165mm; margin-bottom: 8pt; }
.ch-learn { background: rgba(255,255,255,0.75); border-radius: 7px; padding: 8pt 12pt; }
.ch-learn .kicker { margin-bottom: 3pt; }
.ch-learn ul { margin: 0; padding-left: 14pt; columns: 2; column-gap: 18pt; }
.ch-learn li { font-size: 8.6pt; margin-bottom: 1.5pt; break-inside: avoid; }

h2.sec {
  font-size: 13.5pt; font-weight: 700; margin: 16pt 0 7pt 0;
  padding-bottom: 3pt; border-bottom: 1.5px solid #D5E3E8;
  break-after: avoid;
}
h2.sec .secno { color: #0E7490; font-weight: 600; margin-right: 6pt; }
h3 { font-size: 11pt; font-weight: 600; margin: 12pt 0 5pt 0; break-after: avoid; }
h3 .secno { color: #0E7490; font-weight: 600; margin-right: 5pt; }
h4 { font-size: 9.8pt; font-weight: 700; margin: 9pt 0 4pt 0; color: #23404F; break-after: avoid; }

/* ---------- callouts ---------- */
.co { border-radius: 7px; padding: 7pt 11pt 7pt 12pt; margin: 8pt 0; max-width: 172mm;
      break-inside: avoid; border-left: 4px solid; }
.co .co-t { font-size: 7.4pt; font-weight: 700; letter-spacing: 1.4pt; text-transform: uppercase; margin-bottom: 2pt; }
.co p:last-child, .co ul:last-child { margin-bottom: 0; }
.co-note   { background: #EDF6F8; border-color: #0E7490; } .co-note .co-t { color: #0E7490; }
.co-rule   { background: #F0F2F4; border-color: #44606F; } .co-rule .co-t { color: #44606F; }
.co-warn   { background: #FBF3E4; border-color: #9A5B00; } .co-warn .co-t { color: #9A5B00; }
.co-danger { background: #FBEDEC; border-color: #B4232A; } .co-danger .co-t { color: #B4232A; }
.co-tip    { background: #EDF7F0; border-color: #1A7A45; } .co-tip .co-t { color: #1A7A45; }
.co-gap    { background: #F5F1FA; border-color: #6D4E9E; } .co-gap .co-t { color: #6D4E9E; }

/* ---------- tables ---------- */
table { border-collapse: collapse; width: 100%; margin: 8pt 0 10pt 0; font-size: 8.6pt;
        font-variant-numeric: tabular-nums; }
th { background: #14424E; color: #fff; font-weight: 600; text-align: left;
     padding: 4pt 7pt; font-size: 8.2pt; letter-spacing: 0.2pt; }
td { padding: 3.5pt 7pt; border-bottom: 0.75px solid #DDE7EB; vertical-align: top; }
tr:nth-child(even) td { background: #F7FAFB; }
table.compact th, table.compact td { padding: 2.5pt 5pt; font-size: 8pt; }
td .mono, th .mono { font-size: 7.6pt; }
.tbl-cap { font-size: 7.8pt; color: #5B6B76; margin: -6pt 0 10pt 2pt; }

/* status pills */
.pill { display: inline-block; border-radius: 8px; padding: 0.5pt 7pt; font-size: 7.6pt;
        font-weight: 600; white-space: nowrap; }
.p-red    { background: #FBEDEC; color: #B4232A; border: 1px solid #E4B6B8; }
.p-orange { background: #FDF1E3; color: #B45309; border: 1px solid #EBCBA4; }
.p-yellow { background: #FCF8E3; color: #8A6D00; border: 1px solid #E7DCA8; }
.p-green  { background: #EDF7F0; color: #1A7A45; border: 1px solid #B9DCC6; }
.p-teal   { background: #EDF6F8; color: #0E7490; border: 1px solid #B4D8E1; }
.p-slate  { background: #F0F2F4; color: #44606F; border: 1px solid #C9D4DA; }
.p-purple { background: #F5F1FA; color: #6D4E9E; border: 1px solid #D4C6E8; }

/* ---------- flow diagrams (CSS) ---------- */
.flow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; margin: 10pt 0;
        break-inside: avoid; }
.fnode { border: 1.4px solid #14424E; border-radius: 8px; background: #fff;
         padding: 5pt 9pt; font-size: 8.3pt; font-weight: 600; color: #14424E;
         display: flex; flex-direction: column; justify-content: center; text-align: center;
         max-width: 40mm; }
.fnode .sub { font-weight: 400; font-size: 7.2pt; color: #5B6B76; margin-top: 1pt; }
.fnode.start { background: #EDF6F8; border-color: #0E7490; color: #0E7490; }
.fnode.end   { background: #EDF7F0; border-color: #1A7A45; color: #1A7A45; }
.fnode.bad   { background: #FBEDEC; border-color: #B4232A; color: #B4232A; }
.fnode.warn  { background: #FBF3E4; border-color: #9A5B00; color: #9A5B00; }
.fnode.sys   { background: #F0F2F4; border-style: dashed; }
.farrow { align-self: center; color: #7A8C96; padding: 0 5pt; font-size: 10pt; }
.farrow .lbl { display: block; font-size: 6.8pt; color: #5B6B76; text-align: center; margin-bottom: -2pt; }

/* vertical step list ("what the system does") */
.steps { counter-reset: st; margin: 8pt 0 10pt 0; max-width: 172mm; }
.step { position: relative; padding: 0 0 7pt 24pt; border-left: 1.6px solid #C9DEE5; margin-left: 9pt; }
.step:last-child { border-left-color: transparent; padding-bottom: 2pt; }
.step::before {
  counter-increment: st; content: counter(st);
  position: absolute; left: -10pt; top: -1pt; width: 18pt; height: 18pt; border-radius: 50%;
  background: #0E7490; color: #fff; font-size: 8.6pt; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.step > b:first-child { color: #14424E; }
.step p, .step ul { margin-bottom: 3pt; }
.step .then { font-size: 8.2pt; color: #5B6B76; }

/* decision tree (nested) */
.dtree { margin: 8pt 0 10pt 4pt; max-width: 172mm; break-inside: avoid; }
.dq { font-weight: 700; font-size: 9.2pt; color: #14424E; margin: 5pt 0 3pt 0; }
.dq::before { content: "?"; display: inline-flex; width: 13pt; height: 13pt; border-radius: 50%;
  background: #0E7490; color: #fff; font-size: 8pt; font-weight: 800;
  align-items: center; justify-content: center; margin-right: 5pt; }
.dbr { margin-left: 16pt; padding-left: 10pt; border-left: 1.6px solid #C9DEE5; margin-bottom: 4pt; }
.dbr .dlab { font-size: 7.6pt; font-weight: 700; letter-spacing: 0.6pt; text-transform: uppercase; }
.dbr .yes { color: #1A7A45; } .dbr .no { color: #B4232A; } .dbr .maybe { color: #9A5B00; }

/* role chips */
.role { display: inline-block; border-radius: 4px; padding: 0 5pt; font-size: 7.5pt; font-weight: 700;
        background: #14424E; color: #fff; letter-spacing: 0.4pt; }
.role.r2 { background: #0E7490; } .role.r3 { background: #5B6B76; }

/* two-col layout for compact fact groups */
.cols2 { columns: 2; column-gap: 20pt; max-width: 172mm; }
.cols2 > * { break-inside: avoid; }

/* keep-together card */
.card { border: 1px solid #D5E3E8; border-radius: 8px; padding: 9pt 12pt; margin: 8pt 0;
        break-inside: avoid; max-width: 172mm; }
.card h4 { margin-top: 0; }

/* page-marker (invisible; read by the TOC page-number pass). Must stay IN
   the render (white 2px text, absolutely positioned) — clipping it out
   (height:0/overflow:hidden) removes it from the PDF text layer entirely. */
.pgmark { position: absolute; color: #ffffff; font-size: 2px; line-height: 1; }

/* scenario blocks */
.scen { display: grid; grid-template-columns: 34mm 1fr; gap: 4pt 10pt; font-size: 8.6pt;
        margin: 6pt 0; max-width: 172mm; }
.scen dt { font-weight: 700; color: #44606F; }
.scen dd { margin: 0; }

hr.thin { border: none; border-top: 1px solid #D5E3E8; margin: 12pt 0; }
.avoid-break { break-inside: avoid; }
</style>
</head>
<body>
