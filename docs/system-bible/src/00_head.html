<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartTriage — System Bible</title>
<style>
/* ============================================================
   SmartTriage System Bible — print design system  (Edition 1.1)
   Type: Charter (body serif, high-legibility) + Avenir Next
         (headings, tables, labels) + Menlo (data)
   Palette: ink #16232C · teal #0E7490 / deep #14424E · paper #FFF
   tint #F1F6F8 · muted #55666F · danger #B4232A · warn #92580A
   success #1A7A45 · gap-purple #6D4E9E
   Rhythm: 10.9pt/1.66 body · generous margins · nothing collides
   ============================================================ */
@page { size: A4; margin: 19mm 18mm 21mm 18mm; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  font-family: "Charter", "Iowan Old Style", Georgia, serif;
  font-size: 10.9pt; line-height: 1.66; color: #16232C;
  font-feature-settings: "kern", "liga";
}

/* ---------- type hierarchy ----------
   H1 chapter 23pt · H2 section 15.5pt · H3 12.5pt · H4 10.5pt
   body 10.9 · table 9.2 · caption 8.6 · label 8  (all sans except body) */
h1, h2, h3, h4 { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: #16232C; }
p { margin: 0 0 9pt 0; max-width: 166mm; }
strong, b { font-weight: 700; }
em, i { font-style: italic; }
code, .mono {
  font-family: "Menlo", monospace; font-size: 9pt;
  background: #EEF3F5; border-radius: 3px; padding: 0.5pt 4pt; color: #14424E;
}
a { color: #0E7490; text-decoration: none; }
ul, ol { margin: 2pt 0 10pt 0; padding-left: 17pt; max-width: 162mm; }
li { margin-bottom: 4.5pt; }
li > ul, li > ol { margin-top: 4pt; margin-bottom: 0; }

.kicker {
  font-family: "Avenir Next", sans-serif;
  font-size: 8pt; font-weight: 700; letter-spacing: 2pt; text-transform: uppercase;
  color: #0E7490; margin-bottom: 5pt;
}
.muted { color: #55666F; }
.small { font-size: 9.2pt; }

/* ---------- chapters ---------- */
.chapter { break-before: page; }
.ch-open {
  background: linear-gradient(135deg, #F1F6F8 0%, #E6F0F3 100%);
  border-radius: 12px; padding: 24pt 26pt 20pt 26pt; margin-bottom: 22pt;
  border-left: 6px solid #0E7490;
}
.ch-num {
  font-family: "Avenir Next", sans-serif;
  font-size: 38pt; font-weight: 300; color: #0E7490; line-height: 1;
  letter-spacing: -1pt; margin-bottom: 4pt;
}
.ch-open h1 { font-size: 23pt; font-weight: 700; letter-spacing: -0.3pt; margin: 3pt 0 9pt 0; line-height: 1.15; }
.ch-lede { font-size: 11.4pt; color: #33505E; max-width: 158mm; margin-bottom: 12pt; line-height: 1.6; }
.ch-learn { background: rgba(255,255,255,0.8); border-radius: 9px; padding: 10pt 14pt; }
.ch-learn .kicker { margin-bottom: 5pt; }
.ch-learn ul { margin: 0; padding-left: 14pt; columns: 2; column-gap: 22pt; }
.ch-learn li { font-family: "Avenir Next", sans-serif; font-size: 9pt; margin-bottom: 3pt; break-inside: avoid; color: #33505E; }

h2.sec {
  font-size: 15.5pt; font-weight: 700; margin: 24pt 0 10pt 0;
  padding-bottom: 5pt; border-bottom: 1.5px solid #CFE0E6;
  break-after: avoid; letter-spacing: -0.2pt;
}
h2.sec .secno { color: #0E7490; font-weight: 600; margin-right: 8pt; }
h3 { font-size: 12.5pt; font-weight: 600; margin: 16pt 0 7pt 0; break-after: avoid; }
h3 .secno { color: #0E7490; font-weight: 600; margin-right: 6pt; }
h4 { font-size: 10.5pt; font-weight: 700; margin: 13pt 0 6pt 0; color: #23404F; break-after: avoid;
     letter-spacing: 0.1pt; }

/* ---------- callouts ---------- */
.co { border-radius: 9px; padding: 10pt 14pt 10pt 15pt; margin: 12pt 0; max-width: 166mm;
      break-inside: avoid; border-left: 4.5px solid; }
.co .co-t { font-family: "Avenir Next", sans-serif; font-size: 8pt; font-weight: 700;
            letter-spacing: 1.6pt; text-transform: uppercase; margin-bottom: 4pt;
            display: flex; align-items: center; gap: 5pt; }
.co .co-t::before { content: ""; width: 7pt; height: 7pt; border-radius: 50%; display: inline-block; }
.co p, .co ul { font-size: 10.3pt; line-height: 1.6; }
.co p:last-child, .co ul:last-child { margin-bottom: 0; }
.co-note   { background: #EDF6F8; border-color: #0E7490; } .co-note .co-t { color: #0E7490; } .co-note .co-t::before { background: #0E7490; }
.co-rule   { background: #F1F3F5; border-color: #44606F; } .co-rule .co-t { color: #44606F; } .co-rule .co-t::before { background: #44606F; }
.co-warn   { background: #FBF3E2; border-color: #92580A; } .co-warn .co-t { color: #92580A; } .co-warn .co-t::before { background: #B47516; }
.co-danger { background: #FBEDEC; border-color: #B4232A; } .co-danger .co-t { color: #B4232A; } .co-danger .co-t::before { background: #B4232A; }
.co-tip    { background: #EDF7F0; border-color: #1A7A45; } .co-tip .co-t { color: #1A7A45; } .co-tip .co-t::before { background: #1A7A45; }
.co-gap    { background: #F5F1FA; border-color: #6D4E9E; } .co-gap .co-t { color: #6D4E9E; } .co-gap .co-t::before { background: #6D4E9E; }

/* ---------- tables ---------- */
table { border-collapse: collapse; width: 100%; margin: 10pt 0 14pt 0;
        font-family: "Avenir Next", sans-serif; font-size: 9.2pt;
        font-variant-numeric: tabular-nums; line-height: 1.45; }
th { background: #14424E; color: #fff; font-weight: 600; text-align: left;
     padding: 6pt 9pt; font-size: 8.6pt; letter-spacing: 0.3pt; }
td { padding: 5.5pt 9pt; border-bottom: 0.75px solid #DCE6EA; vertical-align: top; }
tr:nth-child(even) td { background: #F6FAFB; }
table.compact th { padding: 4.5pt 7pt; font-size: 8.2pt; }
table.compact td { padding: 4pt 7pt; font-size: 8.8pt; }
td .mono, th .mono, td code { font-size: 8.2pt; }
.tbl-cap { font-size: 8.8pt; color: #55666F; margin: -8pt 0 14pt 2pt; font-style: italic; }

/* status pills */
.pill { font-family: "Avenir Next", sans-serif; display: inline-block; border-radius: 9px;
        padding: 1pt 8pt; font-size: 8.2pt; font-weight: 600; white-space: nowrap; }
.p-red    { background: #FBEDEC; color: #B4232A; border: 1px solid #E4B6B8; }
.p-orange { background: #FDF1E3; color: #B45309; border: 1px solid #EBCBA4; }
.p-yellow { background: #FCF8E3; color: #8A6D00; border: 1px solid #E7DCA8; }
.p-green  { background: #EDF7F0; color: #1A7A45; border: 1px solid #B9DCC6; }
.p-teal   { background: #EDF6F8; color: #0E7490; border: 1px solid #B4D8E1; }
.p-slate  { background: #F1F3F5; color: #44606F; border: 1px solid #C9D4DA; }
.p-purple { background: #F5F1FA; color: #6D4E9E; border: 1px solid #D4C6E8; }

/* ---------- flow diagrams ----------
   PROPER GRID: real row + column gaps so wrapped rows NEVER collide;
   nodes share a minimum height and center on the arrow line. */
.flow { display: flex; align-items: stretch; flex-wrap: wrap; gap: 8pt 6pt;
        margin: 14pt 0 16pt 0; break-inside: avoid; }
.fnode { font-family: "Avenir Next", sans-serif;
         border: 1.5px solid #14424E; border-radius: 9px; background: #fff;
         padding: 7pt 12pt; font-size: 9pt; font-weight: 600; color: #14424E;
         display: flex; flex-direction: column; justify-content: center; text-align: center;
         max-width: 44mm; min-height: 34pt; line-height: 1.3; }
.fnode .sub { font-weight: 500; font-size: 7.8pt; color: #55666F; margin-top: 2.5pt; line-height: 1.35; }
.fnode.start { background: #EDF6F8; border-color: #0E7490; color: #0E7490; }
.fnode.end   { background: #EDF7F0; border-color: #1A7A45; color: #1A7A45; }
.fnode.bad   { background: #FBEDEC; border-color: #B4232A; color: #B4232A; }
.fnode.warn  { background: #FBF3E2; border-color: #92580A; color: #92580A; }
.fnode.sys   { background: #F1F3F5; border-style: dashed; }
.farrow { font-family: "Avenir Next", sans-serif; align-self: center; color: #7A8C96;
          padding: 0 3pt; font-size: 11pt; font-weight: 500; }
.farrow .lbl { display: block; font-size: 7.4pt; color: #55666F; text-align: center; margin-bottom: -1pt; }

/* vertical step list */
.steps { counter-reset: st; margin: 12pt 0 14pt 0; max-width: 166mm; }
.step { position: relative; padding: 0 0 12pt 28pt; border-left: 1.8px solid #C7DDE4; margin-left: 10pt; }
.step:last-child { border-left-color: transparent; padding-bottom: 2pt; }
.step::before {
  counter-increment: st; content: counter(st);
  font-family: "Avenir Next", sans-serif;
  position: absolute; left: -11pt; top: -1pt; width: 21pt; height: 21pt; border-radius: 50%;
  background: #0E7490; color: #fff; font-size: 9.6pt; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.step > b:first-child { font-family: "Avenir Next", sans-serif; color: #14424E; font-size: 10.3pt; }
.step p, .step ul { margin-bottom: 4pt; }

/* decision tree */
.dtree { margin: 12pt 0 6pt 4pt; max-width: 166mm; break-inside: avoid; }
.dq { font-family: "Avenir Next", sans-serif; font-weight: 700; font-size: 10.3pt;
      color: #14424E; margin: 8pt 0 5pt 0; display: flex; align-items: baseline; gap: 6pt; }
.dq::before { content: "?"; flex: 0 0 auto; display: inline-flex; width: 14pt; height: 14pt; border-radius: 50%;
  background: #0E7490; color: #fff; font-size: 9pt; font-weight: 800;
  align-items: center; justify-content: center; transform: translateY(2pt); }
.dbr { margin-left: 20pt; padding: 2pt 0 2pt 12pt; border-left: 1.8px solid #C7DDE4; margin-bottom: 7pt;
       font-size: 10.3pt; line-height: 1.6; }
.dbr .dlab { font-family: "Avenir Next", sans-serif; font-size: 8.2pt; font-weight: 700;
             letter-spacing: 0.8pt; text-transform: uppercase; }
.dbr .yes { color: #1A7A45; } .dbr .no { color: #B4232A; } .dbr .maybe { color: #92580A; }

/* role chips */
.role { font-family: "Avenir Next", sans-serif; display: inline-block; border-radius: 5px;
        padding: 0.5pt 6pt; font-size: 8pt; font-weight: 700;
        background: #14424E; color: #fff; letter-spacing: 0.5pt; }
.role.r2 { background: #0E7490; } .role.r3 { background: #55666F; }

/* two-col fact cards — explicit gaps, no collisions */
.cols2 { columns: 2; column-gap: 8mm; max-width: 166mm; margin: 10pt 0; }
.cols2 > * { break-inside: avoid; margin-top: 0; }
.card { border: 1px solid #D3E2E8; border-radius: 10px; padding: 11pt 14pt; margin: 0 0 8pt 0;
        break-inside: avoid; max-width: 166mm; background: #FDFEFE; }
.card h4 { margin-top: 0; margin-bottom: 4pt; }
.card p { font-size: 9.8pt; line-height: 1.58; }
/* cards outside cols2 (FAQ) get vertical rhythm */
.chapter > .card { margin: 10pt 0; }

/* scenario definition grid */
.scen { display: grid; grid-template-columns: 40mm 1fr; gap: 7pt 12pt; font-size: 10.2pt;
        margin: 10pt 0 14pt 0; max-width: 166mm; line-height: 1.55; }
.scen dt { font-family: "Avenir Next", sans-serif; font-weight: 700; color: #44606F; font-size: 9.4pt; }
.scen dd { margin: 0; }

hr.thin { border: none; border-top: 1px solid #D3E2E8; margin: 16pt 0; }
.avoid-break { break-inside: avoid; }
sup.xref { color: #0E7490; font-weight: 600; font-size: 7.6pt; }

/* page-marker (invisible; read by the TOC page-number pass). Must stay IN
   the render (white 2px absolute text) — clipping removes it from the text layer. */
.pgmark { position: absolute; color: #ffffff; font-size: 2px; line-height: 1; }
</style>
</head>
<body>
